# Service CI — reusable workflow called by SpaceCat / Mysticat Lambda services.
#
# VPC attachment: see docs/vpc-config.md for consumer enablement, environment
# protection recommendations, rollback, and egress notes. Toggle via the
# `vpc-enabled` input; defaults to false so existing callers are unaffected.
#
# Secret scope caveat: AWS_ACCOUNT_ID_DEV/_STAGE/_PROD are intentionally
# repo-level. Do not duplicate them into the dev/stage/prod GitHub Environments
# — environment-scoped secrets shadow repo-scoped ones of the same name and
# could cause deploys to land in the wrong AWS account.
name: Service CI

on:
  workflow_call:
    inputs:
      service-name:
        description: "Service name for artifact naming (e.g., jobs-dispatcher)"
        required: true
        type: string
      validate-pr-title:
        description: "Run semantic PR title validation"
        default: false
        type: boolean
      docs-lint:
        description: "Run docs:lint and docs:build in build step"
        default: false
        type: boolean
      it-postgres:
        description: "Run PostgreSQL (v3) integration tests after build (requires ECR access)"
        default: false
        type: boolean
      bundle-build:
        description: >
          Opt in to a Lambda bundle smoke check via `npm run build`
          (= helix-deploy `--test-bundle`). Bundles the Lambda artifact and
          invokes it against a synthetic healthcheck event — exits non-zero on
          any non-2xx response. Catches module-load failures that source-based
          unit tests miss (missing static assets,
          `readFileSync(import.meta.url)` bundle drops, top-level FS/network
          access). See docs/bundle-build-gate.md. Services that bundle with
          anything other than helix-deploy (e.g. tsup) should leave this off.
        default: false
        type: boolean
      vpc-enabled:
        description: >
          Opt in to declarative VPC attachment. When true, deploy jobs run under
          GitHub Environments (dev/stage/prod), validate that VPC_SUBNET_1/2 and
          VPC_SG_ID are present, export them to the helix-deploy step, wait for
          the Lambda update to settle, and assert post-deploy that the Lambda
          picked up the expected VpcConfig. Consumers must also add
          awsVpcSubnetIds/awsVpcSecurityGroupIds to package.json hlx.
        default: false
        type: boolean
      lambda-function-name:
        description: >
          Optional override for the Lambda function name used by the post-deploy
          VPC verification step. Defaults to spacecat-services--<service-name>.
        default: ""
        type: string
    secrets:
      VPC_SUBNET_1:
        description: "Private subnet ID #1 (from spacecat-infrastructure private_subnet_ids[0]). Required when vpc-enabled."
        required: false
      VPC_SUBNET_2:
        description: "Private subnet ID #2. Required when vpc-enabled."
        required: false
      VPC_SG_ID:
        description: "Lambda security group ID (from lambda_security_group_id). Required when vpc-enabled."
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI_BUILD_NUM: ${{ github.run_id }}
  CI_BRANCH: ${{ github.ref_name }}
  HLX_AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
  protect-nyc-config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Protect NYC config
        uses: adobe/mysticat-ci/.github/actions/protect-nyc-config@v1

  validate-pr-title:
    if: inputs.validate-pr-title && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node & NPM
        uses: adobe/mysticat-ci/.github/actions/setup-node-npm@v1
        env:
          MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN: ${{ secrets.MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN }}

      - name: Lint, Test, Coverage Upload
        uses: adobe/mysticat-ci/.github/actions/lint-test-coverage@v1
        with:
          upload_coverage: "true"
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

      - name: Docs Lint
        if: inputs.docs-lint
        run: npm run docs:lint

      - name: Docs Build
        if: inputs.docs-lint
        run: npm run docs:build

      - name: Build Lambda bundle (smoke check)
        # `npm run build` -> `hedy -v --test-bundle`: bundles + zips + invokes
        # the bundled `lambda()` against a synthetic healthcheck event. Catches
        # the class of failure where source-based unit tests pass but the
        # bundled artifact crashes at cold start (e.g. SITES-45260 — missing
        # static asset / `readFileSync(import.meta.url)` dropped by the
        # bundler). See docs/bundle-build-gate.md.
        if: inputs.bundle-build
        # Step-level timeout bounds the hang vector introduced by hedy's
        # synthetic invocation. If bundled code attempts a network call at
        # module load (precisely the class of bug this gate catches), it can
        # stall on DNS or connection timeout — without this, a hung build
        # would occupy a runner until GitHub's default 360-minute job timeout.
        timeout-minutes: 10
        env:
          # hedy substitutes these into hlx.* fields at build time. They are
          # deploy-time concerns only — dummy values keep the build hermetic
          # so the gate runs on PRs that don't have access to environment-
          # scoped secrets (forks, dependabot, contributors without prod env).
          VPC_SUBNET_1: subnet-00000000000000000
          VPC_SUBNET_2: subnet-00000000000000000
          VPC_SG_ID: sg-00000000000000000
          AWS_ACCOUNT_ID: '000000000000'
        run: npm run build

      - name: Semantic Release (Dry Run)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: npm run semantic-release-dry
        env:
          GITHUB_TOKEN: ${{ secrets.ADOBE_BOT_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}

  it-postgres:
    runs-on: ubuntu-latest
    needs: build
    if: inputs.it-postgres
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure AWS credentials (ECR pull)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PULL_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Node & NPM
        uses: adobe/mysticat-ci/.github/actions/setup-node-npm@v1
        env:
          MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN: ${{ secrets.MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN }}

      - name: Run PostgreSQL Integration Tests
        # Env vars set at process level (before mocha starts) so module-scope
        # initializers in spacecat-shared libraries see them at construction
        # time — mocha's --require'd setup files arrive too late.
        #
        # HELIX_FETCH_FORCE_HTTP1: forces every @adobe/fetch context to h1
        #   mode with keepAlive:false (no socket pool). Otherwise ~9 module-
        #   scope keep-alive Agents (data-access, rum-api-client, gpt-client,
        #   ims-client, vault-secrets, etc.) leave pooled sockets pinning the
        #   Node event loop after teardown, intermittently causing this job
        #   to hit the 15-minute timeout.
        # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY: dummy creds so AWS SDK
        #   clients in the dev server don't try to use the runner's real
        #   STS-issued creds when talking to local MinIO / dummy endpoints.
        # AWS_XRAY_SDK_ENABLED / AWS_XRAY_CONTEXT_MISSING: silence X-Ray
        #   warnings and prevent the X-Ray SDK from attempting to send
        #   tracing segments to a non-existent daemon during IT runs.
        env:
          HELIX_FETCH_FORCE_HTTP1: '1'
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret
          AWS_XRAY_SDK_ENABLED: 'false'
          AWS_XRAY_CONTEXT_MISSING: IGNORE_ERROR
        run: npx mocha --require test/it/postgres/harness.js --timeout 30000 'test/it/postgres/**/*.test.js'

  semantic-release:
    runs-on: ubuntu-latest
    needs: [build, it-postgres]
    if: "!failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'"
    environment: ${{ inputs.vpc-enabled && 'prod' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node & NPM
        uses: adobe/mysticat-ci/.github/actions/setup-node-npm@v1
        env:
          MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN: ${{ secrets.MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN }}

      - name: Configure Environment
        run: echo -e "LOG_LEVEL=info\n" > .env

      - name: Configure AWS for PROD
        uses: adobe/mysticat-ci/.github/actions/configure-aws@v1
        with:
          aws_role_to_assume: 'arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/spacecat-role-github-actions'

      - name: VPC config sanity check
        env:
          VPC_ENABLED: ${{ inputs.vpc-enabled }}
          VPC_SUBNET_1: ${{ secrets.VPC_SUBNET_1 }}
          VPC_SUBNET_2: ${{ secrets.VPC_SUBNET_2 }}
          VPC_SG_ID: ${{ secrets.VPC_SG_ID }}
        run: |
          set -euo pipefail
          HAS_VPC_HLX=0
          if [ -f package.json ] \
             && jq -e '.hlx.awsVpcSubnetIds | arrays | length > 0' package.json >/dev/null 2>&1 \
             && jq -e '.hlx.awsVpcSecurityGroupIds | arrays | length > 0' package.json >/dev/null 2>&1; then
            HAS_VPC_HLX=1
          fi
          if [ "$VPC_ENABLED" = "true" ]; then
            MISSING=()
            [ -z "$VPC_SUBNET_1" ] && MISSING+=("VPC_SUBNET_1")
            [ -z "$VPC_SUBNET_2" ] && MISSING+=("VPC_SUBNET_2")
            [ -z "$VPC_SG_ID" ]    && MISSING+=("VPC_SG_ID")
            if [ ${#MISSING[@]} -gt 0 ]; then
              echo "::error::vpc-enabled=true but missing in the 'prod' environment: ${MISSING[*]}"
              exit 1
            fi
            if [ "$HAS_VPC_HLX" = "0" ]; then
              echo "::error::vpc-enabled=true but package.json hlx is missing non-empty awsVpcSubnetIds or awsVpcSecurityGroupIds. See docs/vpc-config.md."
              exit 1
            fi
            echo "Applying VPC config: SUBNETS=[$VPC_SUBNET_1,$VPC_SUBNET_2] SG=$VPC_SG_ID"
          else
            if [ "$HAS_VPC_HLX" = "1" ]; then
              echo "::error::package.json hlx references awsVpcSubnetIds/awsVpcSecurityGroupIds but vpc-enabled is false. Without opt-in, deploy would silently detach VPC. Set vpc-enabled: true or remove the hlx VPC fields."
              exit 1
            fi
          fi

      - name: Semantic Release
        run: npm run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.ADOBE_BOT_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
          AWS_REGION: us-east-1
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_PROD }}
          VPC_SUBNET_1: ${{ inputs.vpc-enabled && secrets.VPC_SUBNET_1 || '' }}
          VPC_SUBNET_2: ${{ inputs.vpc-enabled && secrets.VPC_SUBNET_2 || '' }}
          VPC_SG_ID: ${{ inputs.vpc-enabled && secrets.VPC_SG_ID || '' }}

      - name: Verify Lambda VPC attachment
        if: inputs.vpc-enabled
        env:
          AWS_REGION: us-east-1
          FUNC: ${{ inputs.lambda-function-name != '' && inputs.lambda-function-name || format('spacecat-services--{0}', inputs.service-name) }}
          EXPECTED_SUBNET_1: ${{ secrets.VPC_SUBNET_1 }}
          EXPECTED_SUBNET_2: ${{ secrets.VPC_SUBNET_2 }}
          EXPECTED_SG: ${{ secrets.VPC_SG_ID }}
        run: |
          set -euo pipefail
          echo "Waiting for Lambda $FUNC to finish updating..."
          aws lambda wait function-updated --function-name "$FUNC"
          VPC=$(aws lambda get-function-configuration --function-name "$FUNC" --query 'VpcConfig' --output json)
          echo "Applied VpcConfig for $FUNC:"
          echo "$VPC" | jq
          echo "$VPC" | jq -e \
            --arg s1 "$EXPECTED_SUBNET_1" --arg s2 "$EXPECTED_SUBNET_2" --arg sg "$EXPECTED_SG" \
            '((.SubnetIds // []) | index($s1) != null) and ((.SubnetIds // []) | index($s2) != null) and ((.SecurityGroupIds // []) | index($sg) != null)' \
            > /dev/null || { echo "::error::VpcConfig on $FUNC does not match expected subnets/SG"; exit 1; }

  deploy-stage:
    runs-on: ubuntu-latest
    needs: [build, it-postgres]
    if: "!failure() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'"
    environment: ${{ inputs.vpc-enabled && 'stage' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node & NPM
        uses: adobe/mysticat-ci/.github/actions/setup-node-npm@v1
        env:
          MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN: ${{ secrets.MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN }}

      - name: Configure AWS for STAGE
        uses: adobe/mysticat-ci/.github/actions/configure-aws@v1
        with:
          aws_role_to_assume: 'arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_STAGE }}:role/spacecat-role-github-actions'
          secret_ids: ''

      - name: VPC config sanity check
        env:
          VPC_ENABLED: ${{ inputs.vpc-enabled }}
          VPC_SUBNET_1: ${{ secrets.VPC_SUBNET_1 }}
          VPC_SUBNET_2: ${{ secrets.VPC_SUBNET_2 }}
          VPC_SG_ID: ${{ secrets.VPC_SG_ID }}
        run: |
          set -euo pipefail
          HAS_VPC_HLX=0
          if [ -f package.json ] \
             && jq -e '.hlx.awsVpcSubnetIds | arrays | length > 0' package.json >/dev/null 2>&1 \
             && jq -e '.hlx.awsVpcSecurityGroupIds | arrays | length > 0' package.json >/dev/null 2>&1; then
            HAS_VPC_HLX=1
          fi
          if [ "$VPC_ENABLED" = "true" ]; then
            MISSING=()
            [ -z "$VPC_SUBNET_1" ] && MISSING+=("VPC_SUBNET_1")
            [ -z "$VPC_SUBNET_2" ] && MISSING+=("VPC_SUBNET_2")
            [ -z "$VPC_SG_ID" ]    && MISSING+=("VPC_SG_ID")
            if [ ${#MISSING[@]} -gt 0 ]; then
              echo "::error::vpc-enabled=true but missing in the 'stage' environment: ${MISSING[*]}"
              exit 1
            fi
            if [ "$HAS_VPC_HLX" = "0" ]; then
              echo "::error::vpc-enabled=true but package.json hlx is missing non-empty awsVpcSubnetIds or awsVpcSecurityGroupIds. See docs/vpc-config.md."
              exit 1
            fi
            echo "Applying VPC config: SUBNETS=[$VPC_SUBNET_1,$VPC_SUBNET_2] SG=$VPC_SG_ID"
          else
            if [ "$HAS_VPC_HLX" = "1" ]; then
              echo "::error::package.json hlx references awsVpcSubnetIds/awsVpcSecurityGroupIds but vpc-enabled is false. Without opt-in, deploy would silently detach VPC. Set vpc-enabled: true or remove the hlx VPC fields."
              exit 1
            fi
          fi

      - name: Deploy to Stage
        run: npm run deploy-stage
        env:
          AWS_REGION: us-east-1
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_STAGE }}
          VPC_SUBNET_1: ${{ inputs.vpc-enabled && secrets.VPC_SUBNET_1 || '' }}
          VPC_SUBNET_2: ${{ inputs.vpc-enabled && secrets.VPC_SUBNET_2 || '' }}
          VPC_SG_ID: ${{ inputs.vpc-enabled && secrets.VPC_SG_ID || '' }}

      - name: Verify Lambda VPC attachment
        if: inputs.vpc-enabled
        env:
          AWS_REGION: us-east-1
          FUNC: ${{ inputs.lambda-function-name != '' && inputs.lambda-function-name || format('spacecat-services--{0}', inputs.service-name) }}
          EXPECTED_SUBNET_1: ${{ secrets.VPC_SUBNET_1 }}
          EXPECTED_SUBNET_2: ${{ secrets.VPC_SUBNET_2 }}
          EXPECTED_SG: ${{ secrets.VPC_SG_ID }}
        run: |
          set -euo pipefail
          echo "Waiting for Lambda $FUNC to finish updating..."
          aws lambda wait function-updated --function-name "$FUNC"
          VPC=$(aws lambda get-function-configuration --function-name "$FUNC" --query 'VpcConfig' --output json)
          echo "Applied VpcConfig for $FUNC:"
          echo "$VPC" | jq
          echo "$VPC" | jq -e \
            --arg s1 "$EXPECTED_SUBNET_1" --arg s2 "$EXPECTED_SUBNET_2" --arg sg "$EXPECTED_SG" \
            '((.SubnetIds // []) | index($s1) != null) and ((.SubnetIds // []) | index($s2) != null) and ((.SecurityGroupIds // []) | index($sg) != null)' \
            > /dev/null || { echo "::error::VpcConfig on $FUNC does not match expected subnets/SG"; exit 1; }

  branch-deploy:
    runs-on: ubuntu-latest
    needs: [build, it-postgres]
    if: "!failure() && !cancelled() && github.event_name == 'push' && github.ref != 'refs/heads/main'"
    # Uses a dedicated env name (dev-branches) rather than 'dev' so that
    # feature-branch deploys to the dev account stay decoupled from any future
    # protection rules applied to 'dev'. See docs/vpc-config.md (§ Environments).
    environment: ${{ inputs.vpc-enabled && 'dev-branches' || '' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - name: Check if branch is up to date with main
        id: main-check
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RESPONSE=$(gh api "repos/${REPO}/compare/main...${REF_NAME}" \
            --jq '{status: .status, behind_by: .behind_by}' 2>/dev/null || echo '{"status":"unknown","behind_by":0}')
          STATUS=$(echo "$RESPONSE" | jq -r '.status')
          BEHIND=$(echo "$RESPONSE" | jq -r '.behind_by')
          if [ "$STATUS" = "behind" ] || [ "$STATUS" = "diverged" ]; then
            echo "skip_deploy=true" >> "$GITHUB_OUTPUT"
            echo "behind_count=$BEHIND" >> "$GITHUB_OUTPUT"
            echo "::warning::Branch is $BEHIND commit(s) behind main — DEV deploy will be skipped"
          else
            echo "skip_deploy=false" >> "$GITHUB_OUTPUT"
            echo "behind_count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.main-check.outputs.skip_deploy != 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node & NPM
        if: steps.main-check.outputs.skip_deploy != 'true'
        uses: adobe/mysticat-ci/.github/actions/setup-node-npm@v1
        env:
          MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN: ${{ secrets.MYSTICAT_DATA_SERVICE_REPO_READ_TOKEN }}

      - name: Configure AWS for DEV
        if: steps.main-check.outputs.skip_deploy != 'true'
        uses: adobe/mysticat-ci/.github/actions/configure-aws@v1
        with:
          aws_role_to_assume: 'arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_DEV }}:role/spacecat-role-github-actions'

      - name: VPC config sanity check
        if: steps.main-check.outputs.skip_deploy != 'true'
        env:
          VPC_ENABLED: ${{ inputs.vpc-enabled }}
          VPC_SUBNET_1: ${{ secrets.VPC_SUBNET_1 }}
          VPC_SUBNET_2: ${{ secrets.VPC_SUBNET_2 }}
          VPC_SG_ID: ${{ secrets.VPC_SG_ID }}
        run: |
          set -euo pipefail
          HAS_VPC_HLX=0
          if [ -f package.json ] \
             && jq -e '.hlx.awsVpcSubnetIds | arrays | length > 0' package.json >/dev/null 2>&1 \
             && jq -e '.hlx.awsVpcSecurityGroupIds | arrays | length > 0' package.json >/dev/null 2>&1; then
            HAS_VPC_HLX=1
          fi
          if [ "$VPC_ENABLED" = "true" ]; then
            MISSING=()
            [ -z "$VPC_SUBNET_1" ] && MISSING+=("VPC_SUBNET_1")
            [ -z "$VPC_SUBNET_2" ] && MISSING+=("VPC_SUBNET_2")
            [ -z "$VPC_SG_ID" ]    && MISSING+=("VPC_SG_ID")
            if [ ${#MISSING[@]} -gt 0 ]; then
              echo "::error::vpc-enabled=true but missing in the 'dev-branches' environment: ${MISSING[*]}"
              exit 1
            fi
            if [ "$HAS_VPC_HLX" = "0" ]; then
              echo "::error::vpc-enabled=true but package.json hlx is missing non-empty awsVpcSubnetIds or awsVpcSecurityGroupIds. See docs/vpc-config.md."
              exit 1
            fi
            echo "Applying VPC config: SUBNETS=[$VPC_SUBNET_1,$VPC_SUBNET_2] SG=$VPC_SG_ID"
          else
            if [ "$HAS_VPC_HLX" = "1" ]; then
              echo "::error::package.json hlx references awsVpcSubnetIds/awsVpcSecurityGroupIds but vpc-enabled is false. Without opt-in, deploy would silently detach VPC. Set vpc-enabled: true or remove the hlx VPC fields."
              exit 1
            fi
          fi

      - name: Branch Deployment
        id: deploy
        if: steps.main-check.outputs.skip_deploy != 'true'
        run: npm run deploy-dev
        env:
          AWS_REGION: us-east-1
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_DEV }}
          VPC_SUBNET_1: ${{ inputs.vpc-enabled && secrets.VPC_SUBNET_1 || '' }}
          VPC_SUBNET_2: ${{ inputs.vpc-enabled && secrets.VPC_SUBNET_2 || '' }}
          VPC_SG_ID: ${{ inputs.vpc-enabled && secrets.VPC_SG_ID || '' }}

      - name: Verify Lambda VPC attachment
        if: steps.main-check.outputs.skip_deploy != 'true' && inputs.vpc-enabled
        env:
          AWS_REGION: us-east-1
          FUNC: ${{ inputs.lambda-function-name != '' && inputs.lambda-function-name || format('spacecat-services--{0}', inputs.service-name) }}
          EXPECTED_SUBNET_1: ${{ secrets.VPC_SUBNET_1 }}
          EXPECTED_SUBNET_2: ${{ secrets.VPC_SUBNET_2 }}
          EXPECTED_SG: ${{ secrets.VPC_SG_ID }}
        run: |
          set -euo pipefail
          echo "Waiting for Lambda $FUNC to finish updating..."
          aws lambda wait function-updated --function-name "$FUNC"
          VPC=$(aws lambda get-function-configuration --function-name "$FUNC" --query 'VpcConfig' --output json)
          echo "Applied VpcConfig for $FUNC:"
          echo "$VPC" | jq
          echo "$VPC" | jq -e \
            --arg s1 "$EXPECTED_SUBNET_1" --arg s2 "$EXPECTED_SUBNET_2" --arg sg "$EXPECTED_SG" \
            '((.SubnetIds // []) | index($s1) != null) and ((.SubnetIds // []) | index($s2) != null) and ((.SecurityGroupIds // []) | index($sg) != null)' \
            > /dev/null || { echo "::error::VpcConfig on $FUNC does not match expected subnets/SG"; exit 1; }

      - name: Post-Deployment Integration Test
        if: steps.main-check.outputs.skip_deploy != 'true'
        run: npm run test-postdeploy

      - name: Upload post-deployment coverage to Codecov
        if: steps.main-check.outputs.skip_deploy != 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Update PR deploy status comment
        if: always() && !cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_DEPLOY: ${{ steps.main-check.outputs.skip_deploy }}
          BEHIND_COUNT: ${{ steps.main-check.outputs.behind_count }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          SERVICE: ${{ inputs.service-name }}
        run: |
          set -euo pipefail
          MARKER="<!-- mysticat-ci-dev-deploy -->"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")

          if [ "$SKIP_DEPLOY" = "true" ]; then
            BODY="${MARKER}
          ### :warning: DEV deploy skipped — \`${SERVICE}\`

          Your branch is **${BEHIND_COUNT} commit(s) behind \`main\`**. The deploy was skipped to prevent deploying outdated code to DEV.

          Click **\"Update branch\"** on this PR to sync with \`main\` and trigger a DEV deployment.

          <sub>:robot: mysticat-ci · <a href=\"${RUN_URL}\">Run #${{ github.run_number }}</a> · ${TIMESTAMP}</sub>"
          elif [ "$DEPLOY_OUTCOME" = "success" ]; then
            BODY="${MARKER}
          ### :white_check_mark: Deployed to DEV — \`${SERVICE}\`

          Branch \`${BRANCH}\` was successfully deployed to **DEV** at ${TIMESTAMP}.

          <sub>:robot: mysticat-ci · <a href=\"${RUN_URL}\">Run #${{ github.run_number }}</a></sub>"
          elif [ "$DEPLOY_OUTCOME" = "failure" ]; then
            BODY="${MARKER}
          ### :x: DEV deploy failed — \`${SERVICE}\`

          The deploy to DEV failed. Check the [workflow run](${RUN_URL}) for details.

          <sub>:robot: mysticat-ci · <a href=\"${RUN_URL}\">Run #${{ github.run_number }}</a> · ${TIMESTAMP}</sub>"
          else
            echo "No deploy was attempted and branch is up to date — skipping comment"
            exit 0
          fi

          PR_NUMBER=$(gh pr list --head "$BRANCH" --repo "${{ github.repository }}" \
            --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for branch ${BRANCH} — skipping comment"
            exit 0
          fi

          EXISTING_COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --paginate --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" 2>/dev/null | head -1)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT_ID}" \
              -X PATCH -f body="$BODY"
            echo "Updated existing comment #${EXISTING_COMMENT_ID} on PR #${PR_NUMBER}"
          else
            gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "$BODY"
            echo "Created new comment on PR #${PR_NUMBER}"
          fi
