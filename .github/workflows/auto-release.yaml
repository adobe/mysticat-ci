name: Auto Release

# Publishes a GitHub Release on every meaningful merge to main, which in turn
# fires release.yaml to move the floating major-version tag (v1, v2, …).
# Removes the manual "create a Release" step so consumers always see the
# latest main on their next CI run.
#
# Version bump rules (semver):
#   - feat: / feat(scope): / feat!: / BREAKING CHANGE in body  → minor bump
#   - feat!: / fix!: / *!: / BREAKING CHANGE in body            → major bump
#   - anything else                                              → patch bump
#
# Skip a release for a specific merge by adding `[skip release]` to the
# commit message subject or body.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next tag
        id: t
        run: |
          set -euo pipefail
          # Find the highest existing semver tag (only vN.N.N — ignore floating vN).
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            echo "ERROR: no existing semver tag (vN.N.N) found"
            exit 1
          fi
          MAJOR=$(echo "$LATEST" | sed -E 's/^v([0-9]+)\..*/\1/')
          MINOR=$(echo "$LATEST" | sed -E 's/^v[0-9]+\.([0-9]+)\..*/\1/')
          PATCH=$(echo "$LATEST" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+).*/\1/')

          MSG="${{ github.event.head_commit.message }}"
          SUBJECT=$(printf '%s\n' "$MSG" | head -1)

          if printf '%s' "$MSG" | grep -qE '^[a-z]+(\([^)]+\))?!:|BREAKING CHANGE'; then
            NEXT="v$((MAJOR+1)).0.0"
            BUMP=major
          elif printf '%s' "$SUBJECT" | grep -qE '^feat(\([^)]+\))?:'; then
            NEXT="v$MAJOR.$((MINOR+1)).0"
            BUMP=minor
          else
            NEXT="v$MAJOR.$MINOR.$((PATCH+1))"
            BUMP=patch
          fi

          echo "latest=$LATEST"           >> "$GITHUB_OUTPUT"
          echo "tag=$NEXT"                >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP"               >> "$GITHUB_OUTPUT"
          echo "Computed next tag: $LATEST -> $NEXT ($BUMP)"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.t.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title  "${{ steps.t.outputs.tag }}" \
            --generate-notes
